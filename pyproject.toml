[project]
name = "trek-fixture"
version = "0.1.0"
description = "Small deterministic Python fixture repository for the Trek autonomous engineering spike."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trek_fixture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
