[project]
name = "trek-fixture"
version = "0.1.0"
description = "Small deterministic Python fixture repository for the Trek autonomous engineering spike."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pint>=0.23"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.6", "pyrefly"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trek_fixture"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
